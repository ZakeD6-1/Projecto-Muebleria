<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Muebleria</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <header>
        <h1>Muebleria</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li id="nav-alta-producto"><a href="alta-producto.html">Alta Producto</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
                <li id="nav-login"></li>
                <li id="nav-carrito"><a href="carrito.html" id="carrito-link">
                    <svg id="carrito-icono" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    <span id="carrito-badge" class="carrito-badge">2</span>
                </a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Carrito de compras</h1>

        <section id="carrito-contenido">
            <table class="carrito-tabla">
                <thead>
                    <tr><th>Producto</th><th>Precio</th></tr>
                </thead>
                <tbody>
                    <tr class="carrito-fila" onclick="openCarritoProducto('Mesa de Vidrio','https://www.dxxi.com.ar/wp-content/uploads/2023/08/dxxi-mesa-comedor-oculo-cuadrada-web-2.jpg','Elegante con vidrio templado para 8 personas.','$275.000')">
                        <td class="carrito-producto">
                            <img class="carrito-thumb" src="https://www.dxxi.com.ar/wp-content/uploads/2023/08/dxxi-mesa-comedor-oculo-cuadrada-web-2.jpg" alt="Mesa de Vidrio">
                            Mesa de Vidrio
                        </td>
                        <td>$275.000</td>
                    </tr>
                    <tr class="carrito-fila" onclick="openCarritoProducto('Silla de Madera','https://http2.mlstatic.com/D_Q_NP_2X_725185-MLA100045878687_122025-T.webp','Comodidad y estilo tradicional.','$45.000')">
                        <td class="carrito-producto">
                            <img class="carrito-thumb" src="https://http2.mlstatic.com/D_Q_NP_2X_725185-MLA100045878687_122025-T.webp" alt="Silla de Madera">
                            Silla de Madera
                        </td>
                        <td>$45.000</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr><td><strong>Total</strong></td><td><strong>$320.000</strong></td></tr>
                </tfoot>
            </table>
            <button class="btn-comprar" onclick="alert('Funcionalidad no disponible')">Comprar</button>
        </section>
    </main>

    <div id="producto-modal" class="producto-modal">
        <div class="producto-modal-backdrop" onclick="closeCarritoProducto()"></div>
        <div class="producto-modal-content">
            <button class="producto-modal-cerrar" onclick="closeCarritoProducto()">✕</button>
            <div class="producto-modal-img">
                <img id="carrito-modal-img" src="" alt="">
            </div>
            <div class="producto-modal-body">
                <h2 id="carrito-modal-nombre"></h2>
                <p id="carrito-modal-desc"></p>
                <p class="precio" id="carrito-modal-precio"></p>
                <button class="btn-comprar" onclick="alert('Funcionalidad no disponible')">Comprar</button>
            </div>
        </div>
    </div>

    <footer id="contacto">
        <p>&copy; 2026 Muebleria</p>
    </footer>

    <script src="auth.js"></script>
    <script>
        function openCarritoProducto(nombre, img, desc, precio) {
            const modal = document.getElementById("producto-modal");
            document.getElementById("carrito-modal-img").src = img;
            document.getElementById("carrito-modal-img").alt = nombre;
            document.getElementById("carrito-modal-nombre").textContent = nombre;
            document.getElementById("carrito-modal-desc").textContent = desc;
            document.getElementById("carrito-modal-precio").textContent = precio;
            modal.classList.add("active");
            document.body.classList.add("no-scroll");
        }

        function closeCarritoProducto() {
            const modal = document.getElementById("producto-modal");
            modal.classList.remove("active");
            document.body.classList.remove("no-scroll");
        }
    </script>
</body>
</html>
