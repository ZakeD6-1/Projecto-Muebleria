<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Muebleria</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="page-layout">

    <header>
        <h1>Muebleria</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li id="nav-alta-producto"><a href="alta-producto.html">Alta Producto</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
                <li id="nav-login"></li>
                <li id="nav-carrito"><a href="carrito.html" id="carrito-link">
                    <svg id="carrito-icono" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    <span id="carrito-badge" class="carrito-badge">0</span>
                </a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Carrito de compras</h1>
        <section id="carrito-contenido"></section>
    </main>

    <div id="producto-modal" class="producto-modal">
        <div class="producto-modal-backdrop" onclick="closeCarritoProducto()"></div>
        <div class="producto-modal-content">
            <button class="producto-modal-cerrar" onclick="closeCarritoProducto()">✕</button>
            <div class="producto-modal-img">
                <img id="carrito-modal-img" src="" alt="">
            </div>
            <div class="producto-modal-body">
                <h2 id="carrito-modal-nombre"></h2>
                <p id="carrito-modal-desc"></p>
                <p class="precio" id="carrito-modal-precio"></p>
            </div>
        </div>
    </div>

    <footer id="contacto">
        <p>&copy; 2026 Muebleria</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
