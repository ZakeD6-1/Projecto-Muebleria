<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alta de Producto</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <style>
        body { min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1 0 auto; }
        footer { flex-shrink: 0; }
    </style>
</head>
<body>

    <header>
        <h1>Muebleria</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li id="nav-alta-producto"><a href="alta-producto.html">Alta Producto</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
                <li id="nav-login"></li>
                <li id="nav-carrito"><a href="carrito.html" id="carrito-link">
                    <svg id="carrito-icono" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    <span id="carrito-badge" class="carrito-badge">2</span>
                </a></li>
            </ul>
        </nav>
    </header>

    <main>

    <h1>Alta de Producto</h1>

    <form id="producto-form">

        <div>
            <label for="nombre">Nombre del producto</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <br>

        <div>
            <label for="descripcion">Descripción</label><br>
            <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
        </div>

        <br>

        <div>
            <label for="precio">Precio</label><br>
            <input type="number" id="precio" name="precio" step="0.01" required>
        </div>

        <br>

        <div>
            <label for="categoria">Categoría</label><br>
            <select id="categoria" name="categoria" required>
                <option value="">Seleccione una categoría</option>
            </select>
            <button type="button" id="btn-nueva-categoria" style="margin-left:8px;padding:4px 12px;font-size:0.85rem;background:#4a7c5a;color:#fff;border:none;border-radius:4px;cursor:pointer;">+ Nueva</button>
            <div id="nueva-categoria-input" style="display:none;margin-top:6px;">
                <input type="text" id="input-nueva-categoria" placeholder="Nombre de la nueva categoría" style="padding:6px;border:1px solid #ccc;border-radius:4px;">
                <button type="button" id="btn-confirmar-categoria" style="margin-left:4px;padding:6px 12px;background:#4a7c5a;color:#fff;border:none;border-radius:4px;cursor:pointer;">Agregar</button>
                <button type="button" id="btn-cancelar-categoria" style="margin-left:4px;padding:6px 12px;background:#ccc;border:none;border-radius:4px;cursor:pointer;">Cancelar</button>
            </div>
        </div>

        <br>

        <div>
            <label for="tags">Tags (separados por coma)</label><br>
            <input type="text" id="tags" name="tags" placeholder="ej: Madera, Metal, Rústico" required>
            <small>El primer tag se usa para filtrar en el catálogo.</small>
        </div>

        <br>

        <div>
            <label for="imagen-url">URL de la imagen</label><br>
            <input type="url" id="imagen-url" name="imagen" placeholder="https://ejemplo.com/imagen.jpg" required>
        </div>

        <br>

        <div>
            <label for="marca">Marca</label><br>
            <input type="text" id="marca" name="marca">
        </div>

        <br>

        <div>
            <label for="sku">SKU</label><br>
            <input type="text" id="sku" name="sku">
        </div>

        <br>

        <div>
            <label for="descuento">Descuento (%)</label><br>
            <input type="number" id="descuento" name="descuento" min="0" max="100" value="0">
        </div>

        <br>

        <div>
            <label>Stock</label><br>
            <input type="radio" id="stock-si" name="stock" value="En Stock" checked>
            <label for="stock-si">Disponible</label>

            <input type="radio" id="stock-no" name="stock" value="Sin Stock">
            <label for="stock-no">Agotado</label>
        </div>

        <br>

        <div>
            <input type="checkbox" id="destacado" name="destacado">
            <label for="destacado">Producto destacado</label>
        </div>

        <br>

        <div>
            <button type="submit">Guardar producto</button>
            <button type="reset">Limpiar</button>
        </div>

    </form>

    <hr style="margin: 3rem 0;">

    <h2>Productos existentes</h2>
    <div id="productos-lista"></div>

    </main>

    <footer id="contacto">
        <p>&copy; 2026 Muebleria</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>
    <script>
        async function cargarCategorias() {
            var select = document.getElementById("categoria");
            var editId = new URLSearchParams(window.location.search).get("edit");
            try {
                var cats = await supaGetCategorias();
                select.innerHTML = '<option value="">Seleccione una categoría</option>';
                cats.forEach(function (c) {
                    var opt = document.createElement("option");
                    opt.value = c.id;
                    opt.textContent = c.nombre;
                    select.appendChild(opt);
                });
                if (editId) {
                    var p = await supaGetProducto(editId);
                    select.value = p.categoria;
                }
            } catch (e) {
                console.error("Error al cargar categorías:", e);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (!isAdmin()) {
                window.location.href = "index.html";
                return;
            }

            cargarCategorias();

            var params = new URLSearchParams(window.location.search);
            var editId = params.get("edit");

            if (editId) {
                document.querySelector("h1").textContent = "Editar Producto";
                cargarProductoParaEditar(editId);
            }

            document.getElementById("btn-nueva-categoria").addEventListener("click", function () {
                document.getElementById("nueva-categoria-input").style.display = "block";
                document.getElementById("input-nueva-categoria").focus();
            });

            document.getElementById("btn-cancelar-categoria").addEventListener("click", function () {
                document.getElementById("nueva-categoria-input").style.display = "none";
                document.getElementById("input-nueva-categoria").value = "";
            });

            document.getElementById("btn-confirmar-categoria").addEventListener("click", function () {
                var input = document.getElementById("input-nueva-categoria");
                var nombre = input.value.trim();
                if (!nombre) return;
                var id = nombre.toLowerCase().replace(/\s+/g, "-");
                var select = document.getElementById("categoria");
                var opt = document.createElement("option");
                opt.value = id;
                opt.textContent = nombre;
                opt.selected = true;
                select.appendChild(opt);
                input.value = "";
                document.getElementById("nueva-categoria-input").style.display = "none";
            });

            document.getElementById("producto-form").addEventListener("submit", async function (e) {
                e.preventDefault();
                var data = {
                    nombre: document.getElementById("nombre").value,
                    descripcion: document.getElementById("descripcion").value,
                    precio: parseFloat(document.getElementById("precio").value),
                    categoria: document.getElementById("categoria").value,
                    tags: document.getElementById("tags").value.split(",").map(function (t) { return t.trim(); }).filter(Boolean),
                    imagen: document.getElementById("imagen-url").value,
                    stock: document.querySelector('input[name="stock"]:checked').value,
                    destacado: document.getElementById("destacado").checked,
                    marca: document.getElementById("marca").value,
                    sku: document.getElementById("sku").value,
                    descuento: parseInt(document.getElementById("descuento").value) || 0,
                };
                try {
                    if (editId) {
                        await supaUpdateProducto(editId, data);
                        alert("Producto actualizado correctamente.");
                    } else {
                        await supaCreateProducto(data);
                        alert("Producto creado correctamente.");
                        document.getElementById("producto-form").reset();
                    }
                    cargarCategorias();
                    cargarProductosLista();
                } catch (err) {
                    alert("Error: " + err.message);
                }
            });
        });

        async function cargarProductoParaEditar(id) {
            try {
                var p = await supaGetProducto(id);
                document.getElementById("nombre").value = p.nombre;
                document.getElementById("descripcion").value = p.descripcion;
                document.getElementById("precio").value = p.precio;
                document.getElementById("categoria").value = p.categoria;
                document.getElementById("tags").value = (p.tags || []).join(", ");
                document.getElementById("imagen-url").value = p.imagen;
                if (p.stock === "Sin Stock") {
                    document.getElementById("stock-no").checked = true;
                } else {
                    document.getElementById("stock-si").checked = true;
                }
                document.getElementById("destacado").checked = p.destacado;
                document.getElementById("marca").value = p.marca || "";
                document.getElementById("sku").value = p.sku || "";
                document.getElementById("descuento").value = p.descuento || 0;
            } catch (err) {
                alert("Error al cargar producto: " + err.message);
            }
        }

        async function cargarProductosLista() {
            var container = document.getElementById("productos-lista");
            try {
                var productos = await supaGetProductos();
                if (productos.length === 0) {
                    container.innerHTML = "<p>No hay productos.</p>";
                    return;
                }
                var html = "<table style='width:100%;border-collapse:collapse;'>" +
                    "<thead><tr style='text-align:left;background:#f5f5f5;'>" +
                    "<th style='padding:8px;'>Imagen</th>" +
                    "<th style='padding:8px;'>Nombre</th>" +
                    "<th style='padding:8px;'>Categoría</th>" +
                    "<th style='padding:8px;'>Precio</th>" +
                    "<th style='padding:8px;'>Dto.</th>" +
                    "<th style='padding:8px;'>Stock</th>" +
                    "<th style='padding:8px;'></th>" +
                    "</tr></thead><tbody>";
                productos.forEach(function (p) {
                    var img = p.imagen || "";
                    html += "<tr style='border-bottom:1px solid #ddd;'>" +
                        "<td style='padding:8px;'>" +
                            (img ? "<img src='" + img + "' alt='" + p.nombre + "' style='width:60px;height:60px;object-fit:cover;border-radius:6px;display:block;'>" : "") +
                        "</td>" +
                        "<td style='padding:8px;'>" + p.nombre + "</td>" +
                        "<td style='padding:8px;'>" + p.categoria + "</td>" +
                        "<td style='padding:8px;'>" + formatPrecio(p.precio) + "</td>" +
                        "<td style='padding:8px;'>" + (p.descuento > 0 ? p.descuento + "%" : "-") + "</td>" +
                        "<td style='padding:8px;'>" + p.stock + "</td>" +
                        "<td style='padding:8px;'>" +
                            "<a href='alta-producto.html?edit=" + p.id + "' style='margin-right:8px;color:#4a7c5a;'>Editar</a>" +
                            "<button onclick='eliminarProducto(" + p.id + ",\"" + p.nombre.replace(/"/g,'&quot;') + "\")' style='background:none;border:none;color:#e74c3c;cursor:pointer;'>Eliminar</button>" +
                        "</td></tr>";
                });
                html += "</tbody></table>";
                container.innerHTML = html;
            } catch (err) {
                container.innerHTML = "<p>Error al cargar productos: " + err.message + "</p>";
            }
        }

        async function eliminarProducto(id, nombre) {
            if (!confirm("¿Eliminar el producto \"" + nombre + "\"?")) return;
            try {
                await supaDeleteProducto(id);
                alert("Producto eliminado.");
                cargarProductosLista();
            } catch (err) {
                alert("Error: " + err.message);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            cargarProductosLista();
        });
    </script>

</body>
</html>
