<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Muebleria</title>
    <link rel="stylesheet" href="style/style.css">
    <style>
        .producto-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }
        .producto-tags .tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            background: #e8f0e9;
            color: #4a7c5a;
            border-radius: 12px;
            cursor: default;
        }
        .btn-editar, .btn-eliminar {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .btn-editar {
            background: #f0d86e;
            color: #333;
        }
        .btn-editar:hover {
            background: #e0c85e;
        }
        .btn-eliminar {
            background: #e74c3c;
            color: #fff;
        }
        .btn-eliminar:hover {
            background: #c0392b;
        }
        .producto-card .producto-acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
        }
        .filtro-seccion {
            margin-bottom: 16px;
        }
        .filtro-seccion h3 {
            font-size: 0.9rem;
            color: #666;
            margin: 0 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .categoria-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .categoria-pill {
            padding: 6px 14px;
            border: 2px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            background: #fff;
            transition: all 0.2s;
            user-select: none;
        }
        .categoria-pill:hover {
            border-color: #4a7c5a;
            color: #4a7c5a;
        }
        .categoria-pill.active {
            background: #4a7c5a;
            border-color: #4a7c5a;
            color: #fff;
        }
        .tags-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .tag-chip {
            padding: 4px 12px;
            border: 1px solid #ccc;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.8rem;
            background: #fff;
            transition: all 0.2s;
            user-select: none;
        }
        .tag-chip:hover {
            border-color: #8ab4a0;
            background: #f0f7f3;
        }
        .tag-chip.active {
            background: #8ab4a0;
            border-color: #8ab4a0;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Muebleria</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li id="nav-alta-producto"><a href="alta-producto.html">Alta Producto</a></li>
                <li><a href="index.html#contacto">Contacto</a></li>
                <li id="nav-login"></li>
                <li id="nav-carrito"><a href="carrito.html" id="carrito-link">
                    <svg id="carrito-icono" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                    </svg>
                    <span id="carrito-badge" class="carrito-badge">2</span>
                </a></li>
            </ul>
        </nav>
    </header>

    <main>

        <button id="filtros-toggle" class="filtros-toggle" onclick="toggleFiltros()">☰ Filtros</button>

        <div id="filtros-overlay" class="filtros-overlay">
            <div class="filtros-overlay-backdrop" onclick="toggleFiltros()"></div>
            <div class="filtros-overlay-content">
                <section id="catalogo-filtros">
                    <div class="filtros-header">
                        <h2>Filtros</h2>
                        <button class="filtros-cerrar" onclick="toggleFiltros()">✕</button>
                    </div>
                    <div id="filtros-container"></div>

                    <div id="tags-activas-container" style="display:none;">
                        <h3>Filtros activos</h3>
                        <div id="tags-activas"></div>
                    </div>
                </section>
            </div>
        </div>

        <section id="productos-catalogo">
            <h2>Productos</h2>
            <div id="productos-grid" class="productos-grid"></div>
        </section>

    </main>

    <div id="producto-modal" class="producto-modal">
        <div class="producto-modal-backdrop" onclick="closeProductoModal()"></div>
        <div class="producto-modal-content">
            <button class="producto-modal-cerrar" onclick="closeProductoModal()">✕</button>
            <div class="producto-modal-img">
                <img id="modal-img" src="" alt="">
            </div>
            <div class="producto-modal-body">
                <h2 id="modal-nombre"></h2>
                <p id="modal-desc"></p>
                <p class="precio" id="modal-precio"></p>
                <button class="btn-comprar" id="modal-add-cart">Agregar al carrito</button>
            </div>
        </div>
    </div>

    <footer id="contacto">
        <p>&copy; 2026 Muebleria</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>
    <script>
        const categorias = [
            {
                id: "mesa", nombre: "Mesas",
                tags: [{ id: "madera", nombre: "Madera" }, { id: "metal", nombre: "Metal" }, { id: "vidrio", nombre: "Vidrio" }]
            },
            {
                id: "silla", nombre: "Sillas",
                tags: [{ id: "madera", nombre: "Madera" }, { id: "metal", nombre: "Metal" }]
            },
            {
                id: "cama", nombre: "Camas",
                tags: [{ id: "madera", nombre: "Madera" }, { id: "2 plazas", nombre: "2 Plazas" }]
            },
            {
                id: "sommier", nombre: "Sommiers",
                tags: [{ id: "2 plazas", nombre: "2 Plazas" }]
            },
        ];

        let productos = [];
        let categoriaSeleccionada = null;
        let tagsSeleccionadas = new Set();

        function renderFiltros() {
            const container = document.getElementById("filtros-container");

            var html = '<div class="filtro-seccion"><h3>Categor\u00eda</h3><div class="categoria-pills">';
            html += '<span class="categoria-pill' + (categoriaSeleccionada === null ? ' active' : '') + '" onclick="seleccionarCategoria(null)">Todas</span>';
            categorias.forEach(function (cat) {
                html += '<span class="categoria-pill' + (categoriaSeleccionada === cat.id ? ' active' : '') + '" onclick="seleccionarCategoria(\'' + cat.id + '\')">' + cat.nombre + '</span>';
            });
            html += '</div></div>';

            var tagsDisponibles = [];
            if (categoriaSeleccionada) {
                var cat = categorias.find(function (c) { return c.id === categoriaSeleccionada; });
                if (cat) tagsDisponibles = cat.tags;
            } else {
                categorias.forEach(function (c) {
                    c.tags.forEach(function (t) {
                        if (!tagsDisponibles.some(function (x) { return x.id === t.id; })) {
                            tagsDisponibles.push(t);
                        }
                    });
                });
            }

            if (tagsDisponibles.length > 0) {
                html += '<div class="filtro-seccion"><h3>Tags</h3><div class="tags-chips">';
                tagsDisponibles.forEach(function (t) {
                    html += '<span class="tag-chip' + (tagsSeleccionadas.has(t.id) ? ' active' : '') + '" onclick="toggleTag(\'' + t.id + '\')">' + t.nombre + '</span>';
                });
                html += '</div></div>';
            }

            container.innerHTML = html;
        }

        function seleccionarCategoria(catId) {
            categoriaSeleccionada = catId;
            if (catId) {
                var cat = categorias.find(function (c) { return c.id === catId; });
                if (cat) {
                    var validIds = cat.tags.map(function (t) { return t.id; });
                    tagsSeleccionadas.forEach(function (t) {
                        if (!validIds.includes(t)) tagsSeleccionadas.delete(t);
                    });
                }
            }
            renderFiltros();
            renderTagsActivas();
            renderProductos();
        }

        function toggleTag(tagId) {
            if (tagsSeleccionadas.has(tagId)) {
                tagsSeleccionadas.delete(tagId);
            } else {
                tagsSeleccionadas.add(tagId);
            }
            renderFiltros();
            renderTagsActivas();
            renderProductos();
        }

        function renderTagsActivas() {
            const container = document.getElementById("tags-activas-container");
            const tagsDiv = document.getElementById("tags-activas");
            var hasFilters = categoriaSeleccionada !== null || tagsSeleccionadas.size > 0;
            if (!hasFilters) {
                container.style.display = "none";
                return;
            }
            container.style.display = "block";
            var html = "";
            if (categoriaSeleccionada) {
                var cat = categorias.find(function (c) { return c.id === categoriaSeleccionada; });
                html += '<span class="tag-activa" onclick="seleccionarCategoria(null)">Categor\u00eda: ' + (cat ? cat.nombre : categoriaSeleccionada) + ' \u2715</span>';
            }
            tagsSeleccionadas.forEach(function (tagId) {
                categorias.forEach(function (c) {
                    c.tags.forEach(function (t) {
                        if (t.id === tagId) {
                            html += '<span class="tag-activa" onclick="removeTag(\'' + tagId + '\')">' + c.nombre + ': ' + t.nombre + ' \u2715</span>';
                        }
                    });
                });
            });
            tagsDiv.innerHTML = html;
        }

        function removeTag(tagId) {
            tagsSeleccionadas.delete(tagId);
            renderFiltros();
            renderTagsActivas();
            renderProductos();
        }

        function renderProductos() {
            const grid = document.getElementById("productos-grid");
            let filtrados = productos;

            if (categoriaSeleccionada) {
                filtrados = filtrados.filter(function (p) { return p.categoria === categoriaSeleccionada; });
            }
            if (tagsSeleccionadas.size > 0) {
                filtrados = filtrados.filter(function (p) {
                    return (p.tags || []).some(function (t) { return tagsSeleccionadas.has(t); });
                });
            }

            if (filtrados.length === 0) {
                grid.innerHTML = "<p>No hay productos que coincidan con los filtros seleccionados.</p>";
                return;
            }
            grid.innerHTML = filtrados.map(function (p, i) {
                return '<article class="producto-card">' +
                    '<div class="producto-imagen">' +
                        '<img src="' + p.imagen + '" alt="' + p.nombre + '">' +
                    '</div>' +
                    '<h3>' + p.nombre + '</h3>' +
                    '<p class="precio">' + formatPrecioConDesc(p) + '</p>' +
                    '<div class="producto-tags">' +
                        p.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join("") +
                    '</div>' +
                    '<div class="producto-acciones">' +
                        '<button class="btn-ver" data-index="' + i + '">Ver</button>' +
                        (isLoggedIn() ? '<button class="btn-comprar-card" onclick="agregarAlCarrito(' + p.id + ')">Agregar al carrito</button>' : '<button class="btn-comprar-card" onclick="openLoginModal()">Agregar al carrito</button>') +
                    '</div>' +
                '</article>';
            }).join("");
            window.__filtrados = filtrados;
        }

        function toggleFiltros() {
            document.getElementById('filtros-overlay').classList.toggle('active');
            document.body.classList.toggle('no-scroll');
        }

        async function cargarProductos() {
            try {
                productos = await supaGetProductos();
                renderProductos();
            } catch (e) {
                document.getElementById("productos-grid").innerHTML =
                    '<p>Error al cargar productos desde la base de datos.</p>';
            }
        }

        function mostrarToast(msg) {
            var t = document.getElementById("toast-msg");
            if (!t) {
                t = document.createElement("div");
                t.id = "toast-msg";
                t.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:8px;z-index:9999;font-size:1rem;transition:opacity 0.3s;opacity:0;";
                document.body.appendChild(t);
            }
            t.textContent = msg;
            t.style.opacity = "1";
            clearTimeout(t._hide);
            t._hide = setTimeout(function () { t.style.opacity = "0"; }, 2500);
        }

        async function agregarAlCarrito(productoId) {
            try {
                await supaAddToCart(getUserId(), productoId, 1);
                mostrarToast("Agregado al carrito");
                updateCarritoBadge();
            } catch (e) {
                mostrarToast("Error al agregar: " + e.message);
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            renderFiltros();
            cargarProductos();

            document.getElementById("productos-grid").addEventListener("click", function (e) {
                var btn = e.target.closest(".btn-ver");
                if (btn) {
                    var index = parseInt(btn.dataset.index);
                    var product = window.__filtrados[index];
                    if (product) openProductoModal(product);
                }
            });
        });

        let currentModalProduct = null;

        function openProductoModal(product) {
            currentModalProduct = product;
            const modal = document.getElementById("producto-modal");
            const btn = document.getElementById("modal-add-cart");
            document.getElementById("modal-img").src = product.imagen;
            document.getElementById("modal-img").alt = product.nombre;
            document.getElementById("modal-nombre").textContent = product.nombre;
            document.getElementById("modal-desc").textContent = product.descripcion;
            document.getElementById("modal-precio").innerHTML = formatPrecioConDesc(product);
            if (isLoggedIn()) {
                btn.onclick = function () { agregarAlCarrito(product.id); };
            } else {
                btn.onclick = function () { closeProductoModal(); openLoginModal(); };
            }
            modal.classList.add("active");
            document.body.classList.add("no-scroll");
        }

        function closeProductoModal() {
            const modal = document.getElementById("producto-modal");
            modal.classList.remove("active");
            document.body.classList.remove("no-scroll");
        }
    </script>

</body>
</html>
